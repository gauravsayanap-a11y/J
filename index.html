<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Inkbound: write, lock and publish books as A4 PDFs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600;700&family=Libre+Franklin:ital,wght@0,400;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;600;700&family=Poppins:ital,wght@0,400;0,600;1,400&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#d6dde2; --bar:#f7f9fa; --line:#c5ced5; --ui:#16222a; --muted:#5a6a75;
  --accent:#2a6d8e; --on-accent:#fff; --hover:rgba(22,34,42,.08); --card:#fff; --danger:#b3372f;
  --ui-font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Newsreader','Iowan Old Style',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#161f26; --bar:#212d35; --line:#34444f; --ui:#e7eef2; --muted:#9aabb6;
    --accent:#7cc0de; --on-accent:#0d1a21; --hover:rgba(255,255,255,.09); --card:#2a3a44; --danger:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --desk:#161f26; --bar:#212d35; --line:#34444f; --ui:#e7eef2; --muted:#9aabb6;
  --accent:#7cc0de; --on-accent:#0d1a21; --hover:rgba(255,255,255,.09); --card:#2a3a44; --danger:#ff8a80;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
@supports (height:100dvh){html,body{height:100dvh}}
body{margin:0;height:100%;background:var(--desk);color:var(--ui);font:15px/1.4 var(--ui-font)}
#root{height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
:focus,:focus-visible{outline:none}
button:focus,button:focus-visible,select:focus,input:focus,input:focus-visible{outline:none!important;box-shadow:none}
button::-moz-focus-inner{border:0}

/* ---------- shared controls ---------- */
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bar);font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.link{background:none;border:0;padding:2px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.link:hover{color:var(--danger)}
.dim{color:var(--muted)}

/* ---------- library ---------- */
.lib{height:100%;overflow:auto;padding:36px clamp(16px,5vw,64px) 60px}
.libwrap{max-width:1040px;margin:0 auto}
.libhead{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:38px}
.wordmark{font:600 clamp(38px,6vw,56px)/1 var(--serif);letter-spacing:-.02em}
.tag{margin:10px 0 0;color:var(--muted);max-width:34ch}
.libacts{display:flex;flex-wrap:wrap;gap:8px}
.shelf{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:26px 22px}
.shelf>.book,.shelf>.newtile{width:120px;flex:none}
.book{display:flex;flex-direction:column;gap:12px}
.cover{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:210/297;width:100%;background:var(--c);color:#fff;border-radius:3px 9px 9px 3px;padding:16% 10% 11% 18%;box-shadow:inset 6px 0 0 rgba(0,0,0,.24),inset 7px 0 0 rgba(255,255,255,.14),0 8px 16px rgba(0,0,0,.26);transition:transform .15s ease}
.cover:hover{transform:translateY(-4px)}
.cover{position:relative}
.cover .lock{position:absolute;top:9px;right:10px;opacity:.9;display:flex}
.pwerr{color:var(--danger);font-size:13px;margin:8px 0 0}
.pwnote{font-size:13px;color:var(--muted);margin:6px 0 0}
.pcx{display:block;width:100%;box-sizing:border-box;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:0 10px;margin-bottom:8px;color:inherit;font:inherit}
.pcx[hidden]{display:none}
.pcx[data-pin]{cursor:pointer;letter-spacing:.2em;caret-color:transparent}
.pcx[data-pin].act{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)!important}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:4px auto 10px;user-select:none;-webkit-user-select:none}
.kp button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:600;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kp button:active{background:var(--hover)}
.kp button.kpf{font-size:15px;font-weight:500;color:var(--muted)}
.pcl{display:block;font-size:13px;color:var(--muted);margin:8px 0 5px}
.mbody .link{background:none;border:0;padding:4px 0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
.pwrm{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:4px}
.ct{font:600 15px/1.15 var(--serif);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ca{font:400 11px/1.3 var(--ui-font);opacity:.85;overflow-wrap:anywhere}
.binfo{font-size:12px;line-height:1.45;text-align:center}
.newtile{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:210/297;width:100%;border:2px dashed var(--line);border-radius:3px 9px 9px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:16px}
.newtile:hover{border-color:var(--accent);color:var(--ui)}
.link.ok:hover{color:var(--accent)}
.note{margin:48px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.warn{background:var(--card);border:1px solid var(--danger);border-radius:10px;padding:12px 14px;margin-bottom:26px;font-size:14px}

/* ---------- editor ---------- */
.editor{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.titleInput{flex:1;min-width:0;font:600 19px var(--serif);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px}
.titleInput:hover{border-color:var(--line)}
.savestate{font-size:13px;color:var(--muted);white-space:nowrap;min-width:5.5em;text-align:right}
.savestate.err{color:var(--danger)}
.tools{display:flex;align-items:center;gap:2px;padding:6px 12px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.tools select{height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);padding:0 8px;margin-right:4px}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.tb{min-width:34px;height:34px;padding:0 8px;border-radius:6px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tb b,.tb i,.tb u{font:600 16px/1 var(--serif)}
.tb i{font-weight:400}
.imgtools{display:inline-flex;align-items:center;gap:2px}
.tb:disabled{opacity:.35;cursor:default}.tb:disabled:hover{background:transparent}
.deskhold{position:relative;flex:1;min-height:0}
#desk{position:absolute;inset:0;overflow:auto;padding:22px 16px 90px;-webkit-overflow-scrolling:touch}
#wrap{position:relative;width:100%}
#sheets{position:absolute;top:0;left:0;width:210mm;transform-origin:0 0}
.status{display:flex;align-items:center;gap:16px;padding:6px 14px;background:var(--bar);border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.status .grow{flex:1}
.status .tb{height:30px;min-width:30px;color:var(--ui)}
.zoomLbl{min-width:3.4em;text-align:center}
.outline{position:absolute;left:0;top:0;bottom:0;width:min(310px,88%);background:var(--bar);border-right:1px solid var(--line);padding:14px;overflow:auto;z-index:5;box-shadow:6px 0 24px rgba(0,0,0,.18)}
.outline h2{margin:0 0 10px;font:600 17px var(--serif)}
.ol{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px}
.ol:hover{background:var(--hover)}
.ol.l2{padding-left:22px;color:var(--muted);font-size:14px}
.ol .pg{color:var(--muted);flex:none}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:20;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px}
.menu button:hover{background:var(--hover)}
.menu small{display:block;color:var(--muted)}

/* editor-only touches on the sheet */
.content{caret-color:currentColor}
.content ::selection,.content::selection{background:rgba(42,109,142,.4)}
.content.empty>p:first-child::before{content:"Start writing your book here…";float:left;height:0;color:#9aa5ad;text-indent:0;pointer-events:none}
.content figure{cursor:pointer;border-radius:3px;-webkit-touch-callout:none}
.content figure img{-webkit-user-select:none;user-select:none}
.content figure,.content figure.sel,.content figure:focus,.content figure img,.content figure img:focus{outline:none!important;border:0}
.content figure,.content figure img{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:none!important;background:transparent}
.content figure figcaption{-webkit-user-select:text;user-select:text}
.content figure::selection,.content figure img::selection{background:transparent!important}
.content figure::-moz-selection,.content figure img::-moz-selection{background:transparent!important}
#figPop{position:fixed;z-index:30;width:min(290px,calc(100vw - 16px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 8px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
#figPop .fsz{display:flex;align-items:center;gap:10px;padding:0 6px 8px;font-size:13px;color:var(--muted)}
#figPop .fsz input{flex:1;min-width:0;accent-color:var(--accent);height:24px}
#figPop .fsz output{min-width:3em;text-align:right;color:var(--ui)}
#figPop .row{display:flex;align-items:center;justify-content:space-between;gap:2px}
#figPop .sep{margin:0 2px}
#figPop .tb{min-width:34px;height:34px;font-size:13px}
.content figcaption{min-height:1.35em;cursor:text}
.content figure:not(.sel) figcaption:empty{display:none}
.layer figure.free{cursor:move}
.layer figure.free,.layer figure.free.sel,.layer figure.free:focus,.layer figure.free img{outline:none!important;border:0}
.layer figure.free.sel{touch-action:none}
.layer figure.free.sel::after{content:"";position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:50%;background:#2a6d8e;border:2px solid #fff;cursor:nwse-resize}
.layer figure.free.crop{overflow:hidden;cursor:default}
.layer figure.free.crop::after{display:none}
.szi{width:62px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 6px;margin-right:4px}
.cg input{width:64px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:0 6px}
#sheets.reading .content{caret-color:transparent}
#sheets.reading .content.empty>p:first-child::before{content:none}
#sheets.reading .layer figure.free{cursor:default}
.content figure.crop{position:relative;overflow:hidden;touch-action:none}
.cbox{position:absolute;border:2px solid #e08a00;box-shadow:0 0 0 400mm rgba(255,255,255,.65);pointer-events:none}
.content figcaption:empty::before{content:"Add a caption";color:#a3adb5}

/* ---------- modal + toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bar);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);max-height:100%;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal h2{margin:0 0 14px;font:600 22px var(--serif)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field select{width:100%;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.swatches,.fontpick{display:flex;flex-wrap:wrap;gap:8px}
.swatches label,.fontpick label{cursor:pointer}
.swatches input,.fontpick input{position:absolute;opacity:0;pointer-events:none}
.sw{display:block;width:34px;height:34px;border-radius:8px;background:var(--c);border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--bar)}
.swatches input:checked+.sw{border-color:var(--ui)}
.fp{display:block;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px}
.fontpick input:checked+.fp{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ui);color:var(--desk);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,460px);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}

@media (max-width:720px){
  .lbl{display:none}
  .bar{padding:6px 8px}
  .tools{padding:4px 8px}
  .savestate{min-width:0}
    .status{gap:10px;padding:5px 10px}
}
.ol.l1{font-weight:600}
.ol.l3{padding-left:36px;color:var(--muted);font-size:13px}
.tb.txt{font:600 13px var(--ui-font);min-width:38px}
.cg{display:inline-flex;align-items:center;gap:6px;padding:0 6px;flex:none;font-size:13px;color:var(--muted)}
.dot{width:22px;height:22px;min-width:22px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--c);flex:none}
.dot:hover{border-color:var(--muted)}
.dot[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#fontSel{width:auto;max-width:150px}

/* ---------- motion: smooth, GPU-friendly, interruptible ---------- */
:root{--ease:cubic-bezier(.22,.8,.24,1);--t:.18s}
button,.btn,.tb,.ol,.menu button,.fp,.sw,.dot,.titleInput,.szi,.link,.newtile{transition:background-color var(--t) ease,border-color var(--t) ease,color var(--t) ease,box-shadow var(--t) ease,transform var(--t) var(--ease),opacity var(--t) ease,filter var(--t) ease}
button,select,input[type=range],.tb,.cover,.newtile{touch-action:manipulation}
.btn:active,.tb:active,.kp button:active{transform:scale(.96)}
.cover{transition:transform .22s var(--ease),box-shadow .22s ease}
.cover:active{transform:translateY(-1px) scale(.98)}
.cover:hover{box-shadow:inset 6px 0 0 rgba(0,0,0,.24),inset 7px 0 0 rgba(255,255,255,.14),0 14px 24px rgba(0,0,0,.3)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:translateY(6px) scale(.98)}}
.lib,.editor{animation:fadeIn .26s ease both}
.shelf>.book,.shelf>.newtile{animation:rise .42s var(--ease) both}
.shelf>:nth-child(2){animation-delay:.03s}.shelf>:nth-child(3){animation-delay:.06s}.shelf>:nth-child(4){animation-delay:.09s}.shelf>:nth-child(5){animation-delay:.12s}.shelf>:nth-child(6){animation-delay:.15s}.shelf>:nth-child(7){animation-delay:.18s}.shelf>:nth-child(8){animation-delay:.21s}.shelf>:nth-child(n+9){animation-delay:.24s}
.backdrop{animation:fadeIn .18s ease both}
.backdrop .modal{animation:popIn .26s var(--ease) both}
.backdrop.out{animation:fadeOut .16s ease both;pointer-events:none}
.backdrop.out .modal{animation:popOut .16s ease both}
/* popovers, menus, contents panel and toast fade/slide instead of snapping */
.menu,#figPop,.outline,#toast{transition:opacity .2s ease,transform .24s var(--ease),visibility .2s}
.menu[hidden]{display:block!important;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none}
#figPop[hidden]{display:block!important;opacity:0;visibility:hidden;transform:translateY(6px) scale(.97);pointer-events:none}
.outline[hidden]{display:block!important;visibility:hidden;transform:translateX(-24px);opacity:0;pointer-events:none;box-shadow:none}
#toast{transform:translate(-50%,0)}
#toast[hidden]{display:block!important;opacity:0;visibility:hidden;transform:translate(-50%,14px);pointer-events:none}
/* zoom glides between levels */
.zanim #sheets{transition:transform .26s var(--ease),left .26s var(--ease)}
/* scrolling feels native and never chains into the page */
#desk,.outline,.modal,.tools{overscroll-behavior:contain;scroll-behavior:auto}
.tools{-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
#desk{scrollbar-gutter:stable both-edges}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- every screen size and orientation ---------- */
.shelf>.book,.shelf>.newtile{width:clamp(96px,16vw,156px)}
.libhead{align-items:flex-end}
.modal{max-height:calc(100% - 8px)}
.backdrop{padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (max-width:520px){
  .lib{padding:22px 14px 48px}
  .libhead{margin-bottom:26px}
  .libacts{width:100%}
  .libacts .btn{flex:1;justify-content:center}
  #desk{padding:12px 6px 80px}
  .titleInput{font-size:17px;padding:4px 6px}
  .modal{padding:16px;border-radius:12px}
  .menu{min-width:min(240px,calc(100vw - 24px))}
  .status{font-size:12px}
}
@media (max-width:360px){
  .bar{gap:4px}
  .btn{padding:0 10px}
  .savestate{display:none}
}
@media (pointer:coarse){
  .tb{min-width:40px;height:40px}
  .tb.txt{min-width:42px}
  .szi,.tools select{height:40px}
  .status .tb{height:36px;min-width:36px}
  .btn{height:40px}
  .menu button{padding:12px 10px}
  .ol{padding:10px 8px}
  .szi,.tools select,.pcx,.field input,.field select,.titleInput,.cg input{font-size:16px}
}
@media (min-width:1500px){
  .lib{padding-top:56px}
  .libwrap{max-width:1240px}
  .shelf>.book,.shelf>.newtile{width:clamp(140px,11vw,190px)}
}
/* phones and tablets turned sideways: reclaim vertical space */
@media (max-height:520px) and (orientation:landscape){
  .bar{padding:3px 8px}
  .tools{padding:2px 8px}
  .status{padding:2px 10px}
  #desk{padding:10px 8px 56px}
  .lib{padding:16px clamp(12px,4vw,48px) 32px}
  .libhead{margin-bottom:16px}
  .wordmark{font-size:34px}
  .btn{height:34px}
  .tb{height:34px}
  .kp button{height:36px}
  .kp{margin-bottom:6px}
  .modal{padding:14px}
  .modal h2{font-size:19px;margin-bottom:8px}
  .mact{margin-top:10px}
  .outline{width:min(280px,60%)}
  #toast{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
@media (hover:none){.cover:hover{transform:none}}

.btn.google{background:#fff;color:#1f1f1f;border-color:#dadce0}
.btn.google:hover{background:#f6f8fb}
.avatar{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--accent);color:var(--on-accent);padding:0;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}

/* =========================================================
   Storage (IndexedDB, with an in-memory fallback)
   ========================================================= */
let db = null;
const mem = {meta: new Map(), content: new Map()};

function openDB(name) {
  return new Promise((res, rej) => {
    try {
      const rq = indexedDB.open(name || 'quire', 1);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        d.createObjectStore('meta', {keyPath: 'id'});
        d.createObjectStore('content', {keyPath: 'id'});
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
      rq.onblocked = () => rej(new Error('blocked'));
    } catch (e) { rej(e); }
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });

let ls = null;                 // localStorage fallback when IndexedDB is unavailable
let LSM = 'quire:meta:', LSC = 'quire:content:';
function lsInit() { try { localStorage.setItem('quire:t', '1'); localStorage.removeItem('quire:t'); ls = localStorage; } catch (e) { ls = null; } }
const lsGet = k => { try { return JSON.parse(ls.getItem(k)); } catch (e) { return null; } };

async function listMeta() {
  if (db) return reqP(db.transaction('meta').objectStore('meta').getAll());
  if (ls) { const out = []; for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k && k.startsWith(LSM)) { const v = lsGet(k); if (v) out.push(v); } } return out; }
  return [...mem.meta.values()];
}
async function getMeta(id) { return db ? reqP(db.transaction('meta').objectStore('meta').get(id)) : ls ? lsGet(LSM + id) : mem.meta.get(id); }
async function loadContent(id) { return db ? reqP(db.transaction('content').objectStore('content').get(id)) : ls ? lsGet(LSC + id) : mem.content.get(id); }
async function saveBookLocal(meta, pages) {
  if (!db) {
    if (ls) { ls.setItem(LSC + meta.id, JSON.stringify({id: meta.id, pages})); ls.setItem(LSM + meta.id, JSON.stringify(meta)); return; }
    mem.meta.set(meta.id, meta); mem.content.set(meta.id, {id: meta.id, pages}); return;
  }
  const t = db.transaction(['meta', 'content'], 'readwrite');
  t.objectStore('meta').put(meta);
  t.objectStore('content').put({id: meta.id, pages});
  await txDone(t);
}
async function removeBookLocal(id) {
  if (!db) {
    if (ls) { ls.removeItem(LSM + id); ls.removeItem(LSC + id); return; }
    mem.meta.delete(id); mem.content.delete(id); return;
  }
  const t = db.transaction(['meta', 'content'], 'readwrite');
  t.objectStore('meta').delete(id);
  t.objectStore('content').delete(id);
  await txDone(t);
}

/* =========================================================
   Book passwords (a lock on opening and deleting a book)
   ========================================================= */
const sha256 = (() => {
  const K = [], H0 = [];
  for (let c = 2, n = 0; n < 64; c++) {
    let pr = true; for (let d = 2; d * d <= c; d++) if (c % d === 0) { pr = false; break; }
    if (!pr) continue;
    if (n < 8) H0[n] = (Math.pow(c, 1 / 2) % 1 * 4294967296) | 0;
    K[n++] = (Math.pow(c, 1 / 3) % 1 * 4294967296) | 0;
  }
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  return str => {
    const b = new TextEncoder().encode(str), l = b.length, nb = ((l + 9 + 63) >> 6) << 6;
    const m = new Uint8Array(nb); m.set(b); m[l] = 0x80;
    const dv = new DataView(m.buffer);
    dv.setUint32(nb - 4, (l * 8) >>> 0); dv.setUint32(nb - 8, Math.floor(l * 8 / 4294967296));
    const h = H0.slice(), w = new Int32Array(64);
    for (let o = 0; o < nb; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getInt32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const x = w[i - 15], y = w[i - 2];
        w[i] = (w[i - 16] + (rr(x, 7) ^ rr(x, 18) ^ (x >>> 3)) + w[i - 7] + (rr(y, 17) ^ rr(y, 19) ^ (y >>> 10))) | 0;
      }
      let [a, b2, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b2) ^ (a & c) ^ (b2 & c))) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b2; b2 = a; a = (t1 + t2) | 0;
      }
      [a, b2, c, d, e, f, g, hh].forEach((v, i) => { h[i] = (h[i] + v) | 0; });
    }
    return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
  };
})();
function pwDigest(pw, salt) { let h = salt + '|' + pw; for (let i = 0; i < 4000; i++) h = sha256(h + salt); return h; }
function makePw(pw) { const s = uid() + uid(); return {s, h: pwDigest(pw, s)}; }
const checkPw = (m, pw) => !!(m && m.pw && pwDigest(pw, m.pw.s) === m.pw.h);
const SEC_QS = ['What was the name of your first pet?', 'What city were you born in?', 'What was your childhood nickname?', 'What was the name of your first school?', 'What is your favorite book?'];
const normAns = t => String(t || '').toLowerCase().replace(/\s+/g, ' ').trim();

async function saveMetaLocal(m) {
  if (db) { const t = db.transaction('meta', 'readwrite'); t.objectStore('meta').put(m); await txDone(t); return; }

/* on-screen number keypad: passcode boxes ([data-pin]) are filled from it, so the phone keyboard never opens */
function attachKeypad(root) {
  const pins = [...root.querySelectorAll('input[data-pin]')], slot = root.querySelector('.kpslot');
  if (!pins.length || !slot) return;
  let cur = pins[0];
  pins.forEach(i => { i.readOnly = true; i.setAttribute('inputmode', 'none'); });
  const mark = i => { cur = i; pins.forEach(x => x.classList.toggle('act', x === i)); };
  const put = d => {
    if (cur.value.length >= 8) return;
    cur.value += d;
    if (cur.value.length === 8) { const n = pins[pins.indexOf(cur) + 1]; if (n) mark(n); }
  };
  const del = () => { cur.value = cur.value.slice(0, -1); };
  pins.forEach(i => {
    i.addEventListener('focus', () => mark(i));
    i.addEventListener('pointerdown', () => mark(i));
    i.addEventListener('keydown', e => {   /* a real keyboard still works too */
      if (/^\d$/.test(e.key)) { e.preventDefault(); put(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); del(); }
    });
  });
  const kp = document.createElement('div');
  kp.className = 'kp';
  kp.setAttribute('role', 'group');
  kp.setAttribute('aria-label', 'Number keypad');
  kp.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')
    + '<button type="button" class="kpf" data-k="clr" aria-label="Clear">Clear</button><button type="button" data-k="0">0</button><button type="button" class="kpf" data-k="del" aria-label="Delete last digit">⌫</button>';
  kp.addEventListener('mousedown', e => e.preventDefault());
  kp.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.k;
    if (k === 'del') del(); else if (k === 'clr') cur.value = ''; else put(k);
    const er = root.querySelector('.pwerr'); if (er) er.hidden = true;
  });
  slot.replaceWith(kp);
  mark(pins[0]);
}

    <p class="pwerr" id="pcErr" role="alert" hidden></p>`;
}
function wirePwFields(root) {
  attachKeypad(root);
  const q = $('#pcQ', root), own = $('#pcQOwn', root);
  q.addEventListener('change', () => { own.hidden = q.value !== '__own'; if (!own.hidden) own.focus(); });

/* returns {none}, {keep}, {err} or {pw} */
function readPwFields(root, has, cur) {
  const p1 = $('#pcA', root).value, p2 = $('#pcB', root).value, sel = $('#pcQ', root).value, own = $('#pcQOwn', root).value.trim();
  const ans = normAns($('#pcAns', root).value), q = sel === '__own' ? own : sel;
  if (!has && !p1) return ans ? {err: 'Enter a passcode first.'} : {none: true};
  if (has && !p1 && !ans) return {keep: true};
  if (p1) {
    if (!/^\d{4,8}$/.test(p1)) return {err: 'Use 4 to 8 digits, numbers only.'};
    if (p1 !== p2) return {err: 'The two passcodes don’t match.'};
  }
  if (!q) return {err: 'Choose or write a security question.'};
  if (!ans) return {err: 'Enter an answer to your security question.'};
  const base = p1 ? makePw(p1) : {s: cur.s, h: cur.h}, as = uid() + uid();
  return {pw: {...base, q, as, ah: pwDigest(ans, as)}};
}

function askPassword(m, title, label, onOk) {

function modal({title, body, actions}) {
  const prev = document.activeElement;
  const back = document.createElement('div');
  back.className = 'backdrop';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(title)}</h2><div class="mbody"></div><div class="mact"></div></div>`;
  const mb = $('.mbody', back);
  if (typeof body === 'string') mb.innerHTML = body; else mb.append(body);
  const onKey = e => { if (e.key === 'Escape') close(); };
  let closing = false;
  const close = () => {
    if (closing) return; closing = true;
    document.removeEventListener('keydown', onKey);
    back.classList.add('out');
    let gone = false; const done = () => { if (gone) return; gone = true; back.remove(); };
    back.addEventListener('animationend', e => { if (e.target === back) done(); });
    setTimeout(done, 260);
    if (prev && prev.focus) prev.focus({preventScroll: true});
  };
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.kind || '');
    b.textContent = a.label;
    b.addEventListener('click', () => { const r = a.onClick ? a.onClick(back) : undefined; if (r !== false) close(); });
    $('.mact', back).append(b);
  });
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  document.addEventListener('keydown', onKey);
  document.body.append(back);
  const first = $('input,select,button', back);
  if (first) first.focus();
  return {close, el: back};
}

function confirmModal(title, text, label, onConfirm) {

  ]});
}

function ago(t) {
  const d = Date.now() - t, m = 60000;
  if (d < m) return 'just now';
  if (d < 60 * m) return Math.floor(d / m) + ' min ago';
  if (d < 24 * 60 * m) { const h = Math.floor(d / (60 * m)); return h + (h === 1 ? ' hour' : ' hours') + ' ago'; }
  const dd = Math.floor(d / (24 * 60 * m));
  if (dd < 30) return dd + (dd === 1 ? ' day' : ' days') + ' ago';
  return new Date(t).toLocaleDateString();
}

const fileSafe = s => (String(s || '').replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 80)) || 'book';

async function saveData(name, data) {
  if (dl) return dl.save({filename: name, data});
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function saveFile(name, data) {
  try {
    await saveData(name, data);
  } catch (err) {
    if (err && err.code === 'declined') return;
    toast('Couldn’t save that file.');
  }
}

  </div></div>`;

  root.onclick = async e => {

    const open = e.target.closest('[data-open]');

async function createBook(pw) {
  const m = {id: uid(), title: 'Untitled book', author: '', color: COLORS[0][1], font: 'serif', size: 12, v2: 1, updated: Date.now(), words: 0, pages: 1};

async function openBook(id) {
  const m = await getMeta(id);
  if (!m) return;
  const c = await loadContent(id);
  meta = m;
  const pages = c && c.pages && c.pages.length ? c.pages : [{hb: false, html: '<p><br></p>'}];
  buildEditor(pages, false);
}

async function writeBackup(list, skipped) {
  const books = [];
  for (const m of list) { const c = await loadContent(m.id); books.push({meta: m, pages: c ? c.pages : []}); }
  saveFile('inkbound-backup.json', JSON.stringify({app: 'quire', version: 1, exported: new Date().toISOString(), books}));
  if (skipped) toast(`Backed up ${plural(books.length, 'book', 'books')}. Left out ${plural(skipped, 'locked book', 'locked books')}.`, 5000);
}
async function backupAll(list) {
  if (!list.length) { toast('There are no books to back up yet.'); return; }
  const open = list.filter(b => !b.pw), locked = list.filter(b => b.pw);
  if (!locked.length) { writeBackup(list, 0); return; }
  const unlockNext = (i, got) => {
    if (i >= locked.length) { writeBackup(open.concat(got), 0); return; }
    const b = locked[i];
    askPassword(b, `Unlock “${b.title || 'Untitled book'}” to include it`, 'Unlock', () => unlockNext(i + 1, got.concat(b)));
  };
  modal({
    title: locked.length === 1 ? '1 book is locked' : locked.length + ' books are locked',
    body: '<p style="margin:0">A backup file isn’t encrypted, so locked books are left out unless you enter their passcodes.</p>',
    actions: [
      {label: 'Cancel'},
      {label: 'Skip locked books', onClick: () => {
        if (!open.length) { toast('Every book is locked, so there’s nothing to back up without a passcode.', 5000); return; }
        setTimeout(() => writeBackup(open, locked.length), 0);
      }},
      {label: 'Unlock and include', kind: 'primary', onClick: () => { setTimeout(() => unlockNext(0, []), 0); }}
    ]
  });
}

async function restoreFromFile(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.books)) throw new Error('bad');
    const existing = new Set((await listMeta()).map(b => b.id));
    let n = 0;
    for (const b of data.books) {
      if (!b || !b.meta || !Array.isArray(b.pages)) continue;
      const m = {...b.meta};
      if (!m.id || existing.has(m.id)) m.id = uid();
      existing.add(m.id);
      m.updated = m.updated || Date.now();
      await saveBook(m, b.pages);
      n++;
    }
    toast(n ? `Restored ${plural(n, 'book', 'books')}` : 'That file has no books in it.');
    showLibrary();
  } catch (e) { toast('That doesn’t look like an Inkbound backup.'); }
}

}

    else { console.error(err); toast('Couldn’t make the PDF. Check your connection and try again.', 5000); }
  } finally {
    pdfBusy = false;
  }
}

  const f = FONTS[meta.font] || FONTS.serif;

function exportTxt() {
  const out = [];
  if (meta.title) out.push(meta.title);
  if (meta.author) out.push('by ' + meta.author);
  sheetList().forEach(s => {
    for (const b of s.firstElementChild.children) {
      if (b.tagName === 'FIGURE') {
        const cap = (b.querySelector('figcaption') || {}).textContent || '';
        out.push(cap.trim() ? `[Image: ${cap.trim()}]` : '[Image]');

      }

      else out.push(t);

function exportJson() {
  const pages = bookPages();
  const m = {...meta, pages: pages.length, words: countWords(), updated: Date.now()};
  saveFile(fileSafe(meta.title) + '-backup.json', JSON.stringify({app: 'quire', version: 1, exported: new Date().toISOString(), books: [{meta: m, pages}]}));
}

/* =========================================================
   Google sign-in + cloud sync (Firebase Auth + Firestore)
   Data layout:  users/{uid}/books/{bookId}            -> {meta, pageCount, updated}
                 users/{uid}/books/{bookId}/chunks/*   -> one doc per page (big pages split)
   The local IndexedDB copy is a per-account cache; Firestore is the source of truth.
   ========================================================= */
const FB_CFG = window.INKBOUND_FIREBASE || {};
const cloudEnabled = !!(window.firebase && FB_CFG.apiKey && !/^YOUR_/.test(FB_CFG.apiKey) && FB_CFG.projectId && !/^YOUR_/.test(FB_CFG.projectId));
let fbAuth = null, fbStore = null, cloudUser = null, curUid, storageReady = false;
let syncState = 'idle';          // idle | syncing | synced | offline
let lastSyncAt = 0, syncing = false, authChain = Promise.resolve();
const CHUNK = 250000;            // characters per Firestore doc (stays far below the 1 MiB doc limit)
const pending = new Map();       // bookId -> {meta, pages}, waiting for the next push
const pushedDocs = new Map();    // bookId -> Map(docId -> string) of what the cloud already has
let pushTimer = 0, pushing = null;

if (cloudEnabled) {
  try {
    firebase.initializeApp(FB_CFG);
    fbAuth = firebase.auth();
    fbStore = firebase.firestore();
    try { fbStore.settings({ignoreUndefinedProperties: true, experimentalAutoDetectLongPolling: true, merge: true}); } catch (e) {}
  } catch (e) { console.error('Firebase init failed', e); fbAuth = null; fbStore = null; }
}
const cloudOn = () => !!(fbAuth && fbStore);

/* ---- per-account local storage ---- */
const dbName = u => u ? 'quire-u-' + u : 'quire';
async function openStorage() {
  db = null; ls = null;
  LSM = curUid ? `quire:u:${curUid}:meta:` : 'quire:meta:';
  LSC = curUid ? `quire:u:${curUid}:content:` : 'quire:content:';
  try { db = await openDB(dbName(curUid)); } catch (e) { db = null; }
  if (!db) lsInit();
  storageReady = true;
}
function closeStorage() { try { if (db) db.close(); } catch (e) {} db = null; storageReady = false; }
function wipeUserCache(u) {
  try { indexedDB.deleteDatabase(dbName(u)); } catch (e) {}
  try {
    const kill = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && (k.startsWith(`quire:u:${u}:`) || k === `inkbound:synced:${u}`)) kill.push(k); }
    kill.forEach(k => localStorage.removeItem(k));
  } catch (e) {}
}
const syncedKey = () => 'inkbound:synced:' + (curUid || '');
function getSynced() { try { return new Set(JSON.parse(localStorage.getItem(syncedKey()) || '[]')); } catch (e) { return new Set(); } }
function putSynced(s) { try { localStorage.setItem(syncedKey(), JSON.stringify([...s])); } catch (e) {} }
function markSynced(id, on) { const s = getSynced(); if (on) s.add(id); else s.delete(id); putSynced(s); }

/* ---- Firestore helpers ---- */
const booksCol = () => fbStore.collection('users').doc(cloudUser.uid).collection('books');
const clean = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(5, '0');
function setSyncState(s) {
  syncState = s;
  const el = document.getElementById('syncst');
  if (el) el.textContent = syncLabel();
  const b = document.getElementById('acctBtn');
  if (b) b.setAttribute('data-sync', s);
}
const syncLabel = () => ({syncing: 'Syncing…', synced: 'All changes saved to your account', offline: 'Couldn’t reach the cloud. Will retry.', idle: ''}[syncState] || '');

function toDocs(pages) {
  const out = new Map();
  pages.forEach((p, i) => {
    const s = JSON.stringify(p);
    const n = Math.max(1, Math.ceil(s.length / CHUNK));
    for (let k = 0; k < n; k++) out.set(`${pad(i)}-${k}`, {i, k, n, d: s.slice(k * CHUNK, (k + 1) * CHUNK)});
  });
  return out;
}
async function pushBook(item) {
  const {meta: m, pages} = item;
  const col = booksCol(), ref = col.doc(m.id), chunks = ref.collection('chunks');
  const docs = toDocs(pages);
  let known = pushedDocs.get(m.id);
  if (!known) {                       // first push this session: learn what is already there
    known = new Map();
    const snap = await chunks.get();
    snap.forEach(d => known.set(d.id, d.data().d));
  }
  // 1) changed chunks first
  let batch = fbStore.batch(), ops = 0, size = 0;
  const commitIf = async force => { if (ops && (force || ops >= 300 || size > 3e6)) { await batch.commit(); batch = fbStore.batch(); ops = 0; size = 0; } };
  for (const [id, v] of docs) {
    if (known.get(id) === v.d) continue;
    batch.set(chunks.doc(id), v); ops++; size += v.d.length;
    await commitIf(false);
  }
  await commitIf(true);
  // 2) the parent doc is the commit marker: other devices only see the new version once it lands
  await ref.set({meta: clean(m), pageCount: pages.length, updated: m.updated || Date.now()});
  // 3) remove chunks that no longer exist (deleted pages)
  for (const id of known.keys()) {
    if (!docs.has(id)) { batch.delete(chunks.doc(id)); ops++; await commitIf(false); }
  }
  await commitIf(true);
  pushedDocs.set(m.id, new Map([...docs].map(([id, v]) => [id, v.d])));
  markSynced(m.id, true);
}
async function pullBook(id) {
  const snap = await booksCol().doc(id).collection('chunks').get();
  const byPage = new Map();
  snap.forEach(d => { const v = d.data(); if (!byPage.has(v.i)) byPage.set(v.i, []); byPage.get(v.i)[v.k] = v.d; });
  const pages = [...byPage.keys()].sort((a, b) => a - b).map(i => JSON.parse(byPage.get(i).join('')));
  const known = new Map(); snap.forEach(d => known.set(d.id, d.data().d));
  pushedDocs.set(id, known);
  return pages;
}

/* ---- push queue ---- */
function cloudQueue(m, pages) {
  if (!cloudUser || !cloudOn()) return;
  pending.set(m.id, {meta: clean(m), pages});
  if (!pushTimer) pushTimer = setTimeout(() => { pushTimer = 0; flushCloud().catch(() => {}); }, 5000);
}
async function cloudRemove(id) {
  if (!cloudUser || !cloudOn()) return;
  pending.delete(id);
  try {
    const ref = booksCol().doc(id);
    const snap = await ref.collection('chunks').get();
    let batch = fbStore.batch(), n = 0;
    for (const d of snap.docs) { batch.delete(d.ref); if (++n >= 400) { await batch.commit(); batch = fbStore.batch(); n = 0; } }
    batch.delete(ref);
    await batch.commit();
    pushedDocs.delete(id); markSynced(id, false);
  } catch (e) { console.error(e); setSyncState('offline'); toast('Couldn’t delete it from your account right now. Check your connection.', 5000); }
}
async function flushCloud() {
  if (pushing) { try { await pushing; } catch (e) {} }
  if (!cloudUser || !cloudOn() || !pending.size) return;
  clearTimeout(pushTimer); pushTimer = 0;
  const run = (async () => {
    setSyncState('syncing');
    for (const [id, item] of [...pending]) {
      await pushBook(item);
      if (pending.get(id) === item) pending.delete(id);   // keep it queued if it changed while pushing
    }
    setSyncState(pending.size ? 'syncing' : 'synced');
    if (pending.size) { pushTimer = setTimeout(() => { pushTimer = 0; flushCloud().catch(() => {}); }, 2000); }
  })();
  pushing = run;
  try { await run; }
  catch (e) {
    console.error('Cloud push failed', e);
    setSyncState('offline');
    if (!pushTimer) pushTimer = setTimeout(() => { pushTimer = 0; flushCloud().catch(() => {}); }, 30000);
    throw e;
  } finally { if (pushing === run) pushing = null; }
}

/* ---- reconcile cloud and this device ---- */
async function syncDown() {
  if (!cloudUser || !cloudOn() || syncing) return false;
  syncing = true; setSyncState('syncing');
  let changed = false;
  try {
    const uidAtStart = cloudUser.uid;
    const snap = await booksCol().get();
    const remote = new Map(); snap.forEach(d => remote.set(d.id, d.data()));
    const local = await listMeta();
    const synced = getSynced();
    const editing = view === 'ed' && meta ? meta.id : null;
    for (const [id, r] of remote) {
      if (!r || !r.meta) continue;
      const l = local.find(x => x.id === id);
      const ru = r.meta.updated || r.updated || 0, lu = l ? (l.updated || 0) : 0;
      if (!l || ru > lu) {
        if (id === editing) continue;
        const pages = await pullBook(id);
        if (!cloudUser || cloudUser.uid !== uidAtStart) return false;
        await saveBook(r.meta, pages, {noSync: true});
        changed = true;
      } else if (lu > ru) {
        const c = await loadContent(id);
        pending.set(id, {meta: clean(l), pages: c ? c.pages : []});
      }
      synced.add(id);
    }
    for (const l of local) {
      if (remote.has(l.id)) continue;
      if (synced.has(l.id)) {                       // it was in the cloud before, so it was deleted on another device
        if (l.id === editing) continue;
        await removeBook(l.id, {noSync: true}); synced.delete(l.id); changed = true;
      } else {                                      // new on this device
        const c = await loadContent(l.id);
        pending.set(l.id, {meta: clean(l), pages: c ? c.pages : []});
      }
    }
    putSynced(synced);
    if (pending.size) await flushCloud();
    lastSyncAt = Date.now();
    setSyncState('synced');
  } catch (e) {
    console.error('Sync failed', e);
    setSyncState('offline');
    if (e && e.code === 'permission-denied') toast('Cloud sync is blocked. Check the Firestore rules in your Firebase project.', 6000);
  } finally { syncing = false; }
  return changed;
}
async function cloudSyncSoon(force) {
  if (!cloudUser || syncing) return;
  if (!force && Date.now() - lastSyncAt < 20000) { if (!syncState || syncState === 'idle') setSyncState('synced'); return; }
  const changed = await syncDown();
  if (changed && view === 'lib') showLibrary(true);
}

/* ---- bring over books made before signing in ---- */
function readGuestBooks() {
  return new Promise(res => {
    try {
      const rq = indexedDB.open('quire', 1);
      rq.onupgradeneeded = () => { try { rq.transaction.abort(); } catch (e) {} };   // no guest DB: don't create one
      rq.onerror = () => res([]);
      rq.onsuccess = () => {
        const d = rq.result;
        try {
          const t = d.transaction(['meta', 'content']);
          const a = t.objectStore('meta').getAll(), b = t.objectStore('content').getAll();
          t.oncomplete = () => { d.close(); const cm = new Map((b.result || []).map(c => [c.id, c])); res((a.result || []).filter(m => m.kind !== 'folder').map(m => ({meta: m, pages: (cm.get(m.id) || {}).pages || []}))); };
          t.onerror = t.onabort = () => { d.close(); res([]); };
        } catch (e) { try { d.close(); } catch (x) {} res([]); }
      };
    } catch (e) { res([]); }
  });
}
async function maybeImportGuest() {
  const flag = 'inkbound:guestAsked:' + cloudUser.uid;
  try { if (localStorage.getItem(flag)) return; } catch (e) {}
  const guest = await readGuestBooks();
  if (!guest.length) return;
  try { localStorage.setItem(flag, '1'); } catch (e) {}
  await new Promise(done => {
    modal({
      title: 'Add your existing books?',
      body: `<p style="margin:0">This device has ${plural(guest.length, 'book', 'books')} saved from before you signed in. Add ${guest.length === 1 ? 'it' : 'them'} to your Google account so you can open ${guest.length === 1 ? 'it' : 'them'} anywhere? Copies also stay on this device for when you’re signed out.</p>`,
      actions: [
        {label: 'Not now', onClick: () => { setTimeout(done, 0); }},
        {label: 'Add to my account', kind: 'primary', onClick: () => {
          setTimeout(async () => {
            try {
              const have = new Set((await listMeta()).map(x => x.id));
              for (const g of guest) {
                const m = {...g.meta};
                if (have.has(m.id)) m.id = uid();
                have.add(m.id);
                await saveBook(m, g.pages.length ? g.pages : [{hb: false, html: '<p><br></p>'}]);
              }
              toast(`Added ${plural(guest.length, 'book', 'books')} to your account`);
            } catch (e) { console.error(e); toast('Couldn’t add them all. They’re still on this device.'); }
            done();
          }, 0);
        }}
      ]
    });
  });
}

/* ---- auth ---- */
const GLOGO = '<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
function acctHTML() {
  if (!cloudOn()) return '';
  if (!cloudUser) return `<button class="btn google" data-act="signin">${GLOGO}Sign in with Google</button>`;
  const name = cloudUser.displayName || cloudUser.email || 'Account';
  const ini = esc((name.trim()[0] || '?').toUpperCase());
  return `<div class="menuwrap" id="acctWrap">
    <button class="avatar" id="acctBtn" data-act="acct" data-sync="${syncState}" aria-haspopup="menu" aria-expanded="false" aria-label="Account" title="${esc(cloudUser.email || name)}"><span>${ini}</span>${cloudUser.photoURL ? `<img src="${esc(cloudUser.photoURL)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</button>
    <div class="menu" id="acctMenu" hidden role="menu">
      <div class="acctwho">${esc(name)}<small>${esc(cloudUser.email || '')}</small></div>
      <div class="acctst" id="syncst">${esc(syncLabel())}</div>
      <button role="menuitem" data-act="syncnow">Sync now</button>
      <button role="menuitem" data-act="signout">Sign out</button>
    </div>
  </div>`;
}
async function cloudSignIn() {
  if (!cloudOn()) { toast('Add your Firebase config at the top of the file first.', 5000); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt: 'select_account'});
  try {
    await fbAuth.signInWithPopup(provider);
  } catch (e) {
    const c = e && e.code;
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
    if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') {
      try { await fbAuth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
    }
    console.error(e);
    if (e.code === 'auth/unauthorized-domain') toast('This website address isn’t authorised in Firebase. Add it under Authentication > Settings > Authorized domains.', 8000);
    else if (e.code === 'auth/operation-not-allowed') toast('Turn on Google sign-in in Firebase: Authentication > Sign-in method.', 8000);
    else toast('Couldn’t sign in. Please try again.', 5000);
  }
}
function cloudSignOut() {
  confirmModal('Sign out?', 'Your books stay safe in your Google account. The copy on this device is removed, and you can get it all back by signing in again.', 'Sign out', async () => {
    try {
      await flushSave();
      await flushCloud();
      if (pending.size) throw new Error('unsynced');
    } catch (e) { toast('Couldn’t finish syncing, so you’re still signed in. Check your connection and try again.', 6000); return; }
    try { await fbAuth.signOut(); } catch (e) { toast('Couldn’t sign out. Please try again.'); }
  });
}
function applyUser(user) {
  return new Promise(resolve => {
    authChain = authChain.then(async () => {
      try {
        const newUid = user ? user.uid : null;
        if (storageReady && newUid === curUid) { cloudUser = user; return; }
        await flushSave();
        try { await flushCloud(); } catch (e) {}
        const prev = curUid;
        closeStorage();
        pending.clear(); pushedDocs.clear(); clearTimeout(pushTimer); pushTimer = 0;
        if (prev && prev !== newUid) wipeUserCache(prev);
        curUid = newUid; cloudUser = user; lastSyncAt = 0; syncState = 'idle';
        await openStorage();
        await showLibrary(true);
        if (user) {
          await maybeImportGuest();
          const changed = await syncDown();
          if (changed || view === 'lib') await showLibrary(true);
        }
      } catch (e) { console.error(e); }
      finally { resolve(); }
    });
  });
}

/* =========================================================
   Start
   ========================================================= */
(async function init() {
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(d => { dl = d; }).catch(() => { dl = null; });
    }
  } catch (e) { dl = null; }
  if (cloudOn()) {
    let first;
    const firstP = new Promise(r => { first = r; });
    fbAuth.onAuthStateChanged(u => { applyUser(u).then(first); });
    await Promise.race([firstP, new Promise(r => setTimeout(r, 3500))]);
  }
  if (!storageReady) {            // not signed in (or auth was slow): use this device's own storage
    curUid = null;
    await openStorage();
    showLibrary();
  }
})();

})();
</script>
